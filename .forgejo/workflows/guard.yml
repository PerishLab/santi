name: guard

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: guard-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    runs-on: docker
    container: mirror.perish.lan/ci/deno
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install stable Ectropy
        uses: PerishLab/actions/setup-binary@main
        env:
          PERISH_SETUP_PRODUCT: ectropy

      - name: Install stable Plumb
        uses: PerishLab/actions/setup-binary@main
        env:
          PERISH_SETUP_PRODUCT: plumb

      - name: Guard
        run: |
          set -eu
          cargo fmt --all --check
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo check --locked --workspace --all-targets --release
          cargo test --locked --workspace
          bash crates/santi/operator/ops/host/30-santi-recovery.test.sh
          bash crates/santi/operator/ops/host/40-santi-deploy.test.sh
          plumb doctor .
          deno fmt --config crates/santi/operator/deno.json --check crates/santi/operator .forgejo/scripts
          deno lint --config crates/santi/operator/deno.json crates/santi/operator
          deno check \
            --config crates/santi/operator/deno.json \
            --lock crates/santi/operator/deno.lock \
            --frozen=true \
            crates/santi/operator/audit.ts \
            crates/santi/operator/contract.test.ts \
            crates/santi/operator/contract.ts \
            crates/santi/operator/deploy.ts \
            crates/santi/operator/dev.ts \
            crates/santi/operator/lib/recovery/recovery.test.ts \
            crates/santi/operator/rollback.ts \
            crates/santi/operator/scp.ts \
            crates/santi/operator/ssh.ts
          deno test \
            --allow-read=crates/santi/operator/ops/edge/ingress.yaml,crates/santi/operator/ops/edge/resources/nginx.conf,crates/santi/operator/packaging/deb/postinst,crates/santi/operator/packaging/deb/root/lib/systemd/system/santi.service \
            --config crates/santi/operator/deno.json \
            --lock crates/santi/operator/deno.lock \
            --frozen=true \
            crates/santi/operator/contract.test.ts
          deno test \
            --allow-run=bash \
            --config crates/santi/operator/deno.json \
            --lock crates/santi/operator/deno.lock \
            --frozen=true \
            crates/santi/operator/lib/recovery/recovery.test.ts
          deno run \
            --allow-read=crates/santi/operator/ops/edge/ingress.yaml,crates/santi/operator/ops/edge/resources/nginx.conf,crates/santi/operator/packaging/deb/postinst,crates/santi/operator/packaging/deb/root/lib/systemd/system/santi.service \
            --config crates/santi/operator/deno.json \
            --lock crates/santi/operator/deno.lock \
            --frozen=true \
            crates/santi/operator/contract.ts
          ectropy .

      - name: sccache statistics
        if: ${{ always() }}
        run: sccache --show-stats

  guard-macos:
    runs-on: macos
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Fetch dependencies
        run: cargo fetch --locked

      - name: Verify native detached jobs
        run: cargo test --locked -p api --test job -- --nocapture

      - name: sccache statistics
        if: ${{ always() }}
        run: sccache --show-stats
