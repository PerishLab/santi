[layout]

[[layout.seat]]
path = "crates/*"
anchor = ["Cargo.toml"]
note = "The santi client, server, and runtime Rust workspace members."

[[layout.seat]]
path = ".cargo"
note = "Cargo registry configuration."

[[layout.seat]]
path = "packaging/deb"
anchor = ["control"]
note = "The santi-api Debian placement wharf packs: control, maintainer scripts, and root/ payload."

[[layout.seat]]
path = ".runseal"
note = "Committed inert Runseal resources."

[[layout.file]]
name = ["santi.example.toml", ".env.example"]
note = "Tracked local runtime configuration templates; live santi.toml and .env stay ignored."

[[layout.file]]
name = ["Cargo.toml", "Cargo.lock"]
note = "Rust workspace anchors."

[identity]
ns = "santi"

[release]
authority = "https://releases.santi.perish.uk"
binaries = ["santi", "santi-api"]
targets = ["x86_64-unknown-linux-gnu", "aarch64-apple-darwin"]

[release.binary.santi-api]
targets = ["x86_64-unknown-linux-gnu"]
install = false

[release.deb]
binary = "santi-api"
root = "packaging/deb"

[guard.lock]
enforce = true
target = "x86_64-unknown-linux-gnu"
features = ["default", "all-features"]

[[guard.lock.review]]
reference = "04525031091bac58f914745c4f2a982aa1336409076cba9b7637a7cce34e4141"
role = "interoperability"
protocol = "Independent native peer holds alarm.lock while Cron apply must refuse contention."
hold = "The external File remains held across the refused apply, until line 36 unlocks it."
release = "Explicit unlock ends the deliberate hold; File drop also closes the fixture descriptor."
verification = "cron asserts the production Radicula attempt refuses the independently held alarm.lock."
[guard.lock.review.evidence]
"crates/santi-api/tests/locks.rs" = "cee692c4d5e20e587fbd3b6a482e0c069cc524e9af2a949dc871898d9f61b429"
