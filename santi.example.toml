provider = "openai"

[souls.soul_default]
name = "Adam Santi"

[souls.soul_default.channels]

# Optional inference declaration for this Soul. Missing fields inherit the
# service provider defaults; a strand's own declaration overrides the Soul.
# [souls.soul_default.inference]
# provider = "deepseek"
# model = "deepseek-flash"
# reasoning_effort = "high"

# Shared Soul MEMORY source bytes, independent of provider/compact capacity.
# Oversize pauses ordinary requests while the Soul consolidates its source.
[memory]
bytes = 32768

[jobs]
acknowledged_retention_seconds = 604800

# One strand-lifetime execution envelope. Provider rounds are per turn; calls
# and captured tool output accumulate until the strand yields to a new one.
[execution]
# Foreground shell deadline in seconds; long waits belong in detached Jobs.
timeout = 60
profile = "runtime_v1"
rounds = 64
calls = 256
output = 4194304
# Each shell call keeps at most this many bytes or lines; a cut result keeps
# its head and tail and saves the complete output under strand://outputs/.
shell = 8192
lines = 256
# Optional experiment: after this many ordinary shell calls, the next provider
# round offers only the feedback tool. Without a caller command, the Soul may
# choose a native gate or product slice.
# feedback_after_calls = 6
# Optional caller-owned mode: feedback becomes a zero-argument tool that runs
# this exact command and workspace. Captured red and green results both reopen
# the ordinary action window.
# feedback_command = "cargo test --locked --workspace"
# feedback_cwd = "strand://product"

# Optional Ed25519 authority for short-lived, per-effect runtime capabilities.
# Supply private_key through SANTI_CAPABILITY_PRIVATE_KEY in production.
[capability]
issuer = ""
audience = ""
key_id = ""
private_key = ""
ttl_seconds = 120

# Lowest explicit layer for every turn shell. Values may be literals or env://
# references. Soul and strand environment resources override this map.
[environment]

# Source names are logical reference namespaces; loading does not execute files.
# [materials.perish]
# root = "/absolute/path/to/staged/skills"
# format = "skill"
# [materials.notes]
# root = "/absolute/path/to/native/materials"
# format = "native"

[providers.openai]
kind = "openai_responses"
api_key = ""
model = ""
base_url = "https://api.openai.com/v1"
reasoning_effort = ""
summary = ""
bytes = 500000
maintenance_bytes = 750000
# Response headers kept on each round's thinking span. Credentials and cookies
# are always refused.
headers = ["x-request-id"]

[providers.deepseek]
kind = "chat_completions"
api_key = ""
model = "deepseek-flash"
base_url = "https://api.deepseek.com"
thinking = "enabled"
# Replay original reasoning within the runtime-selected history when tools are offered.
replay = "history"
reasoning_effort = ""
bytes = 500000
maintenance_bytes = 750000

# Optional deterministic Get acknowledgement after durable Feishu intake.
# [webhooks.feishu]
# acknowledge = "bot"

# Optional outgoing headers for either inference protocol. Values use strict
# Radicula {{name}} templates with exactly these two runtime variables.
# Existing `headers` above selects response headers to record, independently.
# [providers.openai.request_headers]
# User-Agent = "{{meta.user_agent}}"
# x-opencode-session = "santi-{{strand.id}}"
# No outgoing headers are added unless configured. Templates accept literal text
# and exact variable names; unknown or unavailable variables refuse the request.
# Authentication and HTTP transport/body-control headers cannot be overridden.

# Optional Gemini native streaming through a gateway that accepts Bearer auth.
# Select this profile per strand to compare original signed model-part replay.
# [providers.gemini]
# kind = "gemini_generate_content"
# base_url = "https://api.teamorouter.ai/v1beta"
# api_key = "env://TEAMOROUTER_API_KEY"
# model = "gemini-4-neon"
# bytes = 120000

# Estate-managed inference: set the top-level provider (or a soul/strand
# override) to an access, alias, or "provider/family/scenario". A scenario
# requires a preferred candidate and always uses that offering's model.
# The catalog contains only credential = "custody://router"; this separate
# operator profile must match the access protocol and endpoint exactly.
# [custody.router]
# For a migrated Chat Completions or native Gemini profile, set identity to the original
# provider name to retain its history replay identity, e.g. identity = "deepseek".
# Model, endpoint, and protocol must still match the recorded continuation.
# With request_headers, provide a dedicated random 32-byte hex HMAC key.
# Keep it with custody across restarts; never reuse the API key or Keel sudo.
# seal = "env://SANTI_ROUTER_POLICY_KEY"
# kind = "chat_completions"
# api_key = "env://ROUTER_API_KEY"
# base_url = "https://router.example.invalid/v1"
# model = "direct-selection-default"
# bytes = 120000
# replay = "history"
