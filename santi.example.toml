provider = "openai"

[souls.soul_default]
name = "Adam Santi"

[souls.soul_default.channels]

# Shared Soul MEMORY source bytes, independent of provider/compact capacity.
# Oversize pauses ordinary requests while the Soul consolidates its source.
[memory]
bytes = 32768

[jobs]
acknowledged_retention_seconds = 604800

# One strand-lifetime execution envelope. Provider rounds are per turn; calls
# and captured tool output accumulate until the strand yields to a new one.
[execution]
# Foreground shell deadline in seconds; long waits belong in detached Jobs.
timeout = 60
profile = "runtime_v1"
rounds = 64
calls = 256
output = 4194304
# Each shell call keeps at most this many bytes or lines; a cut result keeps
# its head and tail and saves the complete output under strand://outputs/.
shell = 8192
lines = 256
# Optional experiment: after this many ordinary shell calls, the next provider
# round offers only the feedback tool. Without a caller command, the Soul may
# choose a native gate or product slice.
# feedback_after_calls = 6
# Optional caller-owned mode: feedback becomes a zero-argument tool that runs
# this exact command and workspace. Captured red and green results both reopen
# the ordinary action window.
# feedback_command = "cargo test --locked --workspace"
# feedback_cwd = "strand://product"

# Optional Ed25519 authority for short-lived, per-effect runtime capabilities.
# Supply private_key through SANTI_CAPABILITY_PRIVATE_KEY in production.
[capability]
issuer = ""
audience = ""
key_id = ""
private_key = ""
ttl_seconds = 120

# Lowest explicit layer for every turn shell. Values may be literals or env://
# references. Soul and strand environment resources override this map.
[environment]

# Source names are logical reference namespaces; loading does not execute files.
# [materials.perish]
# root = "/absolute/path/to/staged/skills"
# format = "skill"
# [materials.notes]
# root = "/absolute/path/to/native/materials"
# format = "native"

[providers.openai]
kind = "openai_responses"
api_key = ""
model = ""
base_url = "https://api.openai.com/v1"
reasoning_effort = ""
summary = ""
bytes = 500000
maintenance_bytes = 750000
# Response headers kept on each round's thinking span. Credentials and cookies
# are always refused.
headers = ["x-request-id"]

[providers.deepseek]
kind = "chat_completions"
api_key = ""
model = "deepseek-flash"
base_url = "https://api.deepseek.com"
thinking = "enabled"
# Replay original reasoning within the runtime-selected history when tools are offered.
replay = "history"
reasoning_effort = ""
bytes = 500000
maintenance_bytes = 750000

[providers.siliconflow]
kind = "chat_completions"
api_key = ""
model = "zai-org/GLM-5.2"
base_url = "https://api.siliconflow.cn/v1"
thinking = ""
reasoning_effort = ""
bytes = 500000
maintenance_bytes = 750000
